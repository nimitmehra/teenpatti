<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13254B">
<title>Teen Patti Scorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Cormorant+SC:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design language: see DESIGN-LANGUAGE.md and style-guide-v2.html */
:root{
  --cream:#F8F0DF;       /* page: cream linen */
  --paper:#FFFCF5;       /* panels, plates, seats: ivory paper */
  --hair:#E4D7BC;        /* hairlines between rows */
  --plate-line:#C9BB9A;  /* outline of unselected plates and inputs */
  --hover:#F7EFDD;
  --ink:#121A2C;         /* reading text */
  --grey:#5A5246;        /* secondary text */
  --navy:#13254B;        /* the house: masthead, titles, outlines, selection */
  --green:#0E4A36;       /* play: the main move, money won */
  --green-deep:#0A3828;
  --garnet:#8B2630;      /* caution: pack, money lost */
  --leaf:#A3822F;        /* gold leaf: frames, rules, ornaments; never text */
  --gold-on-navy:#DDBF74;
  --pale-gold:#F2E6C6;   /* honour: current player, winner */
  --antique:#7A5C14;     /* dark gold, allowed as text */
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sc:"Cormorant SC", "Cormorant Garamond", Georgia, serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; min-height:100vh; background:var(--cream); color:var(--ink); font-family:var(--sans); font-size:18px; line-height:1.6; font-variant-numeric:lining-nums; -webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button, input{font-family:var(--sans); font-variant-numeric:lining-nums tabular-nums}
button:focus-visible, input:focus-visible, summary:focus-visible{outline:3px solid var(--leaf); outline-offset:3px}
h1, h2, h3{text-wrap:balance}
.wrap{max-width:920px; margin:0 auto; padding:0 20px 110px}
@media (max-width:640px){ .wrap{padding:0 12px 80px} }

/* ---------- masthead and tabs: the only navy band ---------- */
.mast{background:var(--navy); color:var(--paper); text-align:center; padding:22px 16px 4px}
.mast-title{font-family:var(--sc); font-weight:700; font-size:36px; letter-spacing:.16em; line-height:1; padding-left:.16em}
.mast-sub{font-family:var(--sc); font-weight:600; font-size:16px; letter-spacing:.24em; color:var(--gold-on-navy); margin-top:8px; padding-left:.24em}
.orn{display:flex; align-items:center; gap:12px; max-width:320px; margin:12px auto 0}
.orn::before, .orn::after{content:""; flex:1; height:1px; background:var(--leaf)}
.orn i{width:8px; height:8px; background:var(--leaf); transform:rotate(45deg); flex:none}
.mast .orn::before, .mast .orn::after, .mast .orn i{background:var(--gold-on-navy)}
.tabs{position:sticky; top:0; z-index:20; background:var(--navy); border-bottom:2px solid var(--leaf); display:flex; justify-content:center; gap:6px; padding:6px 12px 0}
.tab{min-height:54px; padding:0 20px; background:transparent; border:none; border-bottom:3px solid transparent; color:var(--gold-on-navy); font-family:var(--sc); font-weight:700; font-size:20px; letter-spacing:.12em; cursor:pointer}
.tab:hover{color:var(--paper)}
.tab.on{color:var(--paper); border-bottom-color:var(--gold-on-navy)}
@media (max-width:640px){
  .mast{padding:16px 12px 2px} .mast-title{font-size:28px} .mast-sub{font-size:14px}
  .tabs{gap:0; padding:4px 4px 0} .tab{flex:1; padding:0 2px; font-size:16px; letter-spacing:.06em; min-height:50px}
}

/* ---------- page heading ---------- */
.intro{text-align:center; max-width:720px; margin:48px auto 0}
.intro h1{font-family:var(--serif); font-weight:700; font-size:clamp(38px,6.4vw,54px); line-height:1.08; margin:0 0 12px; color:var(--navy)}
.intro p{font-size:19px; color:var(--grey); margin:0}

/* ---------- frames: one per section ---------- */
.frame{background:var(--paper); border:2px solid var(--leaf); outline:1px solid var(--leaf); outline-offset:-8px; border-radius:2px; padding:40px 36px 38px; margin-top:36px}
@media (max-width:640px){ .frame{padding:30px 18px 26px; outline-offset:-6px; margin-top:26px} }
.title{font-family:var(--sc); font-weight:700; font-size:25px; letter-spacing:.14em; color:var(--navy); text-align:center; display:flex; align-items:center; justify-content:center; gap:18px; margin:0 0 26px; line-height:1.2}
.title::before, .title::after{content:""; width:56px; height:1px; background:var(--leaf); flex:none}
@media (max-width:480px){ .title{font-size:21px; gap:12px} .title::before, .title::after{width:22px} }
.subtitle{font-family:var(--sc); font-weight:700; font-size:21px; letter-spacing:.12em; color:var(--navy); text-align:center; margin:32px 0 8px}
.kicker{font-family:var(--sc); font-weight:700; font-size:18px; letter-spacing:.14em; color:var(--grey); text-align:center; margin-bottom:6px}
.hint{text-align:center; color:var(--grey); margin:-12px auto 22px; max-width:640px; font-size:17px}
.frame .orn, .plaque .orn{margin:26px auto 24px}
.up{color:var(--green)} .down{color:var(--garnet)}

/* ---------- plates (buttons with a title and a line of explanation) ---------- */
.acts{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:700px){ .acts{grid-template-columns:1fr} }
.plate{display:flex; flex-direction:column; gap:4px; text-align:left; min-height:88px; padding:16px 22px; border-radius:2px; border:1.5px solid var(--navy); background:var(--paper); color:var(--navy); cursor:pointer; transition:background-color .15s ease, transform .08s ease}
.plate:hover{background:var(--hover)}
.plate:active{transform:translateY(1px)}
.plate .t{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; font-size:21px; font-weight:600; line-height:1.25}
.plate .t b{font-family:var(--serif); font-weight:700; font-size:31px; line-height:1}
.plate .t em{font-style:normal; color:var(--leaf)}
.plate .d{font-size:16.5px; line-height:1.45; color:var(--grey)}
.plate-main{grid-column:1/-1; background:var(--green); border-color:var(--green); color:var(--paper); outline:1px solid rgba(221,191,116,.8); outline-offset:-7px; min-height:96px; padding:20px 26px}
.plate-main:hover{background:var(--green-deep)}
.plate-main .t em{color:var(--gold-on-navy)}
.plate-main .d{color:rgba(255,252,245,.88)}
.plate-main:focus-visible{outline:3px solid var(--leaf); outline-offset:3px}
.plate-pack{grid-column:1/-1; border-color:var(--garnet); color:var(--garnet)}
.plate-pack .d{color:var(--garnet)}
.plate-wide{grid-column:1/-1}
.plate.sel{background:var(--navy); color:var(--paper)}
.plate.sel .d{color:rgba(255,252,245,.85)}
.plate.sel .t em{color:var(--gold-on-navy)}
.plate.center{align-items:center; justify-content:center; text-align:center}
.plate.xl{width:100%; margin-top:26px; align-items:center; text-align:center}
.plate[disabled]{opacity:.4; cursor:not-allowed}
.plate[disabled]:active{transform:none}
.btn{min-height:58px; padding:0 24px; border-radius:2px; border:1.5px solid var(--navy); background:var(--paper); color:var(--navy); font-size:18px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-align:center}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn-main{background:var(--green); border-color:var(--green); color:var(--paper)}
.btn-main:hover{background:var(--green-deep)}
.btn-pack{border-color:var(--garnet); color:var(--garnet)}
.btn-link{background:none; border:none; color:var(--grey); text-decoration:underline; text-underline-offset:4px; font-size:17px; font-weight:500; cursor:pointer; min-height:48px; padding:0 8px}
.under{display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; margin-top:18px}
.under .btn{min-width:220px}

/* ---------- setup ---------- */
.count-row{display:grid; grid-template-columns:repeat(7,1fr); gap:10px}
@media (max-width:560px){ .count-row{grid-template-columns:repeat(4,1fr)} }
.count-btn{min-height:78px; border-radius:2px; border:1.5px solid var(--plate-line); background:var(--paper); color:var(--navy); font-family:var(--serif); font-weight:700; font-size:36px; cursor:pointer}
.count-btn:hover{border-color:var(--navy)}
.count-btn.on{background:var(--navy); border-color:var(--navy); color:var(--paper)}
.fields{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px}
.field{display:flex; flex-direction:column; gap:6px}
.field-label{font-family:var(--sc); font-weight:700; font-size:17px; letter-spacing:.12em; color:var(--grey)}
.field-help{font-size:15px; color:var(--grey); line-height:1.45}
.text-in{min-height:60px; border-radius:2px; border:1.5px solid var(--plate-line); background:var(--paper); color:var(--ink); font-size:21px; font-weight:500; padding:0 16px; width:100%}
.text-in::placeholder{color:#A39985}
.text-in:focus{border-color:var(--navy); outline:none; box-shadow:inset 0 0 0 1px var(--navy)}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:600px){ .choices{grid-template-columns:1fr} }
.choice{min-height:74px; border-radius:2px; border:1.5px solid var(--plate-line); background:var(--paper); color:var(--navy); cursor:pointer; text-align:left; padding:12px 18px; font-size:18px; font-weight:600}
.choice small{display:block; font-weight:400; color:var(--grey); font-size:15px; margin-top:2px}
.choice:hover{border-color:var(--navy)}
.choice.on{background:var(--navy); border-color:var(--navy); color:var(--paper)}
.choice.on small{color:var(--gold-on-navy)}
.dealer-row{display:flex; flex-wrap:wrap; justify-content:center; gap:10px}
.dealer-row .choice{min-height:58px; padding:8px 22px; text-align:center}
ol.steps{list-style:none; counter-reset:s; padding:0; margin:0 auto; max-width:640px}
ol.steps li{counter-increment:s; position:relative; padding-left:46px; margin:12px 0}
ol.steps li::before{content:counter(s); position:absolute; left:0; top:-5px; width:30px; text-align:right; font-family:var(--serif); font-weight:700; font-size:28px; color:var(--antique)}
.error{color:var(--garnet); font-weight:600; text-align:center; min-height:28px; margin:14px 0 0}

/* ---------- the turn ---------- */
.turn-name{font-family:var(--serif); font-weight:700; font-size:clamp(46px,8vw,66px); line-height:1.02; text-align:center; margin:10px 0 14px; color:var(--ink)}
.turn-name.sm{font-size:clamp(36px,6.4vw,52px)}
.turn-name.enter{opacity:0; transform:translateY(8px)}
.turn-name.enter.settle{opacity:1; transform:none; transition:opacity .22s ease, transform .22s ease}
.tagline{text-align:center; color:var(--grey); font-size:18px}
.lead-c{text-align:center; color:var(--grey); font-size:18.5px; max-width:660px; margin:0 auto}
.lead-c b{color:var(--ink)}
.tag{display:inline-block; font-family:var(--sc); font-weight:700; font-size:16px; letter-spacing:.14em; line-height:1; color:var(--ink); border:1px solid var(--ink); padding:5px 9px 6px; vertical-align:2px; margin-right:6px}
.money{display:flex; justify-content:center; flex-wrap:wrap; gap:8px 40px; margin-top:22px}
.money div{text-align:center}
.money .l{display:block; font-family:var(--sc); font-weight:700; font-size:17px; letter-spacing:.14em; color:var(--grey)}
.money .n{display:block; font-family:var(--serif); font-weight:700; font-size:46px; line-height:1.05; color:var(--navy); font-variant-numeric:lining-nums tabular-nums}
.limit-note{text-align:center; color:var(--grey); font-size:15px; margin:6px 0 0}
.deal-note{text-align:center; max-width:640px; margin:20px auto 0; padding:12px 4px; border-top:1px solid var(--hair); border-bottom:1px solid var(--hair); font-size:17px}
.put-in{text-align:center; color:var(--grey); font-size:15.5px; margin:16px 0 0}
details.why{margin:20px auto 0; max-width:680px; color:var(--grey)}
details.why summary{cursor:pointer; font-family:var(--sc); font-weight:700; font-size:18px; letter-spacing:.1em; color:var(--navy); list-style:none; min-height:44px; display:flex; align-items:center; justify-content:center; text-align:center}
details.why summary::-webkit-details-marker{display:none}
details.why ul{margin:6px 0 0; padding:0; list-style:none}
details.why li{position:relative; padding-left:24px; margin:8px 0; font-size:16.5px}

/* ---------- seats and log ---------- */
.seats{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px}
.seat{background:var(--paper); border:1px solid var(--plate-line); border-radius:2px; padding:16px 18px; min-width:0}
.seat.now{background:var(--pale-gold); border:2px solid var(--leaf); outline:1px solid var(--leaf); outline-offset:-7px}
.seat.out{opacity:.5}
.seat-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.seat .nm{font-family:var(--serif); font-weight:700; font-size:29px; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.now-l{font-family:var(--sc); font-weight:700; font-size:15px; letter-spacing:.14em; color:var(--antique); flex:none}
.seat .tags{margin:10px 0}
.row{display:flex; justify-content:space-between; font-size:16.5px; color:var(--grey); margin-top:2px}
.row b{color:var(--ink); font-weight:600}
.log{list-style:none; margin:0; padding:0}
.log li{display:flex; gap:16px; padding:11px 0; border-bottom:1px solid var(--hair); font-size:17px}
.log li:last-child{border-bottom:none}
.log .n{font-family:var(--serif); font-weight:700; color:var(--antique); min-width:28px; font-size:19px}

/* ---------- winner's plaque ---------- */
.plaque{background:var(--pale-gold); border:2px solid var(--leaf); outline:1px solid var(--leaf); outline-offset:-8px; border-radius:2px; text-align:center; padding:24px 26px 34px; margin-top:36px}
@media (max-width:640px){ .plaque{padding:20px 16px 26px; outline-offset:-6px} }
.arch{display:block; width:200px; height:84px; margin:0 auto}
.pl-k{font-family:var(--sc); font-weight:700; font-size:17px; letter-spacing:.16em; color:var(--antique); margin-top:-58px; position:relative}
.plaque .kicker{margin-top:30px}
.pl-name{font-family:var(--serif); font-weight:700; font-size:clamp(38px,7vw,56px); line-height:1.05; color:var(--navy); margin:4px 0 8px}
.pl-flavour{font-family:var(--serif); font-style:italic; font-weight:600; font-size:23px; color:var(--grey)}
.nets{display:flex; justify-content:center; flex-wrap:wrap; gap:6px 28px; margin-top:18px; font-size:17px; color:var(--grey)}
.nets b{font-family:var(--serif); font-weight:700; font-size:28px; margin-left:6px; font-variant-numeric:lining-nums tabular-nums}
.cat-chips{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:14px}
.chip{min-height:54px; padding:0 18px; border-radius:2px; border:1.5px solid var(--plate-line); background:var(--paper); color:var(--navy); font-size:17px; font-weight:600; cursor:pointer}
.chip:hover{border-color:var(--navy)}
.chip.on{background:var(--navy); border-color:var(--navy); color:var(--paper)}

/* ---------- scores ---------- */
.lb{display:grid; grid-template-columns:56px 1fr auto auto; gap:18px; align-items:center; padding:16px 4px; border-bottom:1px solid var(--hair)}
.lb:last-child{border-bottom:none}
.lb-rank{font-family:var(--serif); font-weight:700; font-size:38px; color:var(--antique); text-align:center; line-height:1}
.lb-name{font-family:var(--serif); font-weight:700; font-size:28px; line-height:1.1; min-width:0}
.lb-name span{display:block; font-family:var(--sans); font-weight:400; font-size:16px; color:var(--grey); margin-top:4px}
.lb-net{font-family:var(--serif); font-weight:700; font-size:38px; text-align:right; font-variant-numeric:lining-nums tabular-nums}
.lb-chips{text-align:right; min-width:96px}
.lb-chips span{display:block; font-family:var(--sc); font-weight:700; font-size:15px; letter-spacing:.14em; color:var(--grey)}
.lb-chips b{font-weight:600; font-size:19px}
@media (max-width:560px){ .lb{grid-template-columns:34px 1fr auto; gap:12px} .lb-chips{display:none} .lb-net{font-size:30px} .lb-name{font-size:24px} }
.settle{list-style:none; padding:0; margin:0}
.settle li{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:14px 0; border-bottom:1px solid var(--hair); font-size:19px}
.settle li:last-child{border-bottom:none}
.settle b{font-family:var(--serif); font-weight:700; font-size:30px; color:var(--navy)}
.pcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px}
.pc{border:1px solid var(--plate-line); border-radius:2px; padding:20px 22px; background:var(--paper)}
.pc h3{font-family:var(--serif); font-weight:700; font-size:30px; margin:0; line-height:1.1}
.pc .standing{font-weight:600; margin-top:2px}
.pc dl{display:grid; grid-template-columns:1fr auto; gap:6px 14px; margin:12px 0 0; font-size:16.5px}
.pc dt{color:var(--grey)} .pc dd{margin:0; font-weight:600; text-align:right}
.pc .group{grid-column:1/-1; font-family:var(--sc); font-weight:700; font-size:16px; letter-spacing:.14em; color:var(--antique); margin-top:10px}
.hist{list-style:none; padding:0; margin:0}
.hist > li{border-bottom:1px solid var(--hair)}
.hist > li:last-child{border-bottom:none}
.hist-btn{width:100%; background:none; border:none; color:var(--ink); text-align:left; padding:14px 4px; cursor:pointer; display:grid; grid-template-columns:64px 1fr auto; gap:14px; align-items:center; font-size:17px; min-height:64px}
.hist-btn:hover{background:var(--hover)}
.hist-no{font-family:var(--serif); font-weight:700; font-size:24px; color:var(--antique)}
.hist-pot{font-family:var(--serif); font-weight:700; font-size:26px; color:var(--navy)}
.hist-btn .muted{color:var(--grey)}
.hist-detail{padding:0 4px 18px}
.hist-nets{display:flex; flex-wrap:wrap; gap:6px 24px; margin:0 0 8px; color:var(--grey)}
.hist-nets b{font-family:var(--serif); font-weight:700; font-size:24px; margin-left:6px}
.row-actions{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:30px}
.row-actions .btn{flex:1 1 260px; min-height:64px}
.empty{text-align:center; color:var(--grey); font-size:19px; margin:0}

/* ---------- rules and rankings sheets ---------- */
.sheet .sk{font-family:var(--sc); font-weight:700; font-size:16px; letter-spacing:.14em; color:var(--antique); margin-top:46px}
.sheet .sk:first-child{margin-top:0}
.sheet h2.sh{font-family:var(--serif); font-weight:700; font-size:clamp(28px,4.4vw,34px); color:var(--navy); margin:2px 0 8px; line-height:1.15}
.sheet p, .sheet li{font-size:18.5px; line-height:1.7}
.sheet ol.steps{max-width:none}
.note{border-top:1px solid var(--leaf); border-bottom:1px solid var(--leaf); padding:16px 4px; margin:22px 0; text-align:center}
.note p{margin:0}
.sheet table{width:100%; border-collapse:collapse; margin:14px 0; font-size:17.5px}
.sheet th, .sheet td{border-bottom:1px solid var(--hair); padding:12px 10px; text-align:left; vertical-align:top}
.sheet th{font-family:var(--sc); font-weight:700; font-size:16px; letter-spacing:.12em; color:var(--grey)}
.move{border:1px solid var(--plate-line); padding:14px 18px; margin:12px 0; background:var(--paper)}
.move h3{margin:0 0 4px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:19px; font-weight:600; color:var(--navy)}
.move h3 span{font-family:var(--sc); font-weight:700; font-size:16px; letter-spacing:.1em; color:var(--antique)}
.move p{margin:0}
dl.words{display:grid; grid-template-columns:minmax(120px,190px) 1fr; gap:10px 20px; margin:10px 0}
dl.words dt{font-weight:600; color:var(--navy)} dl.words dd{margin:0}
@media (max-width:560px){ dl.words{grid-template-columns:1fr} dl.words dd{margin-bottom:10px} }
ul.dia{list-style:none; padding:0; margin:0}
ul.dia li{position:relative; padding-left:26px; margin:10px 0}
ul.dia li::before, details.why li::before{content:""; position:absolute; left:4px; top:.66em; width:7px; height:7px; background:var(--leaf); transform:rotate(45deg)}
.sheet p.source{color:var(--grey); font-size:15px; margin:30px 0 0}
.rank-row{display:grid; grid-template-columns:56px 240px 1fr; gap:22px; align-items:center; padding:22px 0; border-bottom:1px solid var(--hair)}
.rank-row:first-child{padding-top:0}
.rank-num{font-family:var(--serif); font-weight:700; font-size:48px; color:var(--antique); text-align:center; line-height:1}
.rank-cards{display:flex; gap:10px}
.sheet p.rank-name{font-family:var(--serif); font-weight:700; font-size:30px; color:var(--navy); margin:0; line-height:1.1}
.sheet p.rank-alias{font-family:var(--sc); font-weight:700; font-size:16px; letter-spacing:.1em; line-height:1.4; color:var(--grey); margin:4px 0 6px}
.rank-text{margin:0}
.rank-odds{display:block; margin-top:6px; font-size:15.5px; font-weight:600; color:var(--antique)}

.modal-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px}

.ck-hand{border:1px solid var(--plate-line); border-radius:2px; padding:16px 18px; margin-top:14px; background:var(--paper)}

.rank-btn{min-height:76px; border-radius:2px; background:var(--paper); color:var(--ink); border:1.5px solid var(--plate-line); font-family:var(--serif); font-size:34px; font-weight:700; cursor:pointer}

<body>
<header class="mast">
  <div class="mast-title">Teen Patti</div>
  <div class="orn" aria-hidden="true"><i></i></div>
  <div class="mast-sub">The Family Card Table</div>
</header>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<main id="app"></main>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
'use strict';

/* =====================================================================
   1. CONSTANTS AND CARD LOGIC  (no screen code here)
   ===================================================================== */
const STORE_KEY = 'teenpatti.scorer.v1';
const CATS = ['High card', 'Pair', 'Colour', 'Sequence', 'Pure sequence', 'Trail'];
const CAT_ALIAS = ['Nothing matching', 'Two of a kind', 'Also called a flush', 'Also called a run or straight', 'Also called a pure run or straight flush', 'Also called a trio or set'];
const RANKS = [14, 13, 12, 11, 10, 9, 8, 7, 6, 5, 4, 3, 2];
const RANK_LABEL = {14:'A', 13:'K', 12:'Q', 11:'J', 10:'10', 9:'9', 8:'8', 7:'7', 6:'6', 5:'5', 4:'4', 3:'3', 2:'2'};
const SUITS = [
  {k:'S', sym:'♠︎', name:'Spades',   red:false},
  {k:'H', sym:'♥︎', name:'Hearts',   red:true},
  {k:'D', sym:'♦︎', name:'Diamonds', red:true},
  {k:'C', sym:'♣︎', name:'Clubs',    red:false}
];
const HOW_SHORT = {packed:'Everyone else packed', show:'Show', sideshow:'Side show', potlimit:'Pot limit show'};

// Returns a score list: [category, tie-breakers...]. Bigger wins.
function evaluate(cards, a23Top) {
  const rs = cards.map(c => c.r).sort((a, b) => b - a);
  const flush = cards.every(c => c.s === cards[0].s);
  const isA23 = rs[0] === 14 && rs[1] === 3 && rs[2] === 2;
  const isRun = (rs[0] - 1 === rs[1] && rs[1] - 1 === rs[2]) || isA23;
  if (rs[0] === rs[2]) return [5, rs[0]];
  if (isRun) return [flush ? 4 : 3, isA23 ? (a23Top ? 15 : 13.5) : rs[0]];
  if (flush) return [2, rs[0], rs[1], rs[2]];
  if (rs[0] === rs[1]) return [1, rs[0], rs[2]];
  if (rs[1] === rs[2]) return [1, rs[1], rs[0]];
  return [0, rs[0], rs[1], rs[2]];
}
function compareEval(a, b) {
  const n = Math.max(a.length, b.length);
  for (let i = 0; i < n; i++) { const d = (a[i] || 0) - (b[i] || 0); if (d) return d > 0 ? 1 : -1; }
  return 0;
}

/* =====================================================================
   2. GAME STATE
   ===================================================================== */
function defaultSettings() {
  return {boot:10, startChips:1000, limitsOn:true, stakeLimit:1280, potLimit:10240, a23Top:false};
}
function freshState() {
  return {v:1, phase:'setup', settings:defaultSettings(), players:[], dealer:0, hand:null, history:[]};
}

let state = freshState();
let undoStack = [];
const ui = {tab:'table', draft:null, setupError:'', checker:null, confirm:null, plSel:[], openHand:null, toast:''};

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({state:state, undo:undoStack.slice(-60)})); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || !o.state || o.state.v !== 1) return null;
    return o;
  } catch (e) { return null; }
}
function snapshot() {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 60) undoStack.shift();
}

/* ---------- helpers ---------- */
function fmt(n) { return Number(n).toLocaleString('en-IN'); }
function signed(n) { return (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n)); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c])); }
function pname(id) { const p = state.players.find(p => p.id === id); return p ? p.name : '?'; }
function seatName(i) { return pname(state.hand.seats[i].id); }
function E(i) { return esc(seatName(i)); }
function activeIdx(h) { return h.seats.map((s, i) => i).filter(i => h.seats[i].status !== 'packed'); }
function nextActive(h, i) {
  const n = h.seats.length;
  for (let k = 1; k <= n; k++) { const j = (i + k) % n; if (h.seats[j].status !== 'packed') return j; }
  return i;
}
function prevActive(h, i) {
  const n = h.seats.length;
  for (let k = 1; k < n; k++) { const j = (i - k + n) % n; if (h.seats[j].status !== 'packed') return j; }
  return -1;
}
function pay(h, i, amt) { h.seats[i].putIn += amt; h.pot += amt; }
function addLog(h, e) { h.log.push(e); }
function potLimitHit(h) { const s = state.settings; return s.limitsOn && h.pot >= s.potLimit; }
function canRaise(h) { const s = state.settings; return !s.limitsOn || h.stake * 2 <= s.stakeLimit; }

function chipsOf(id) {
  let c = state.settings.startChips;
  for (const h of state.history) c += h.result.nets[id] || 0;
  const h = state.hand;
  if (h) {
    if (h.result) c += h.result.nets[id] || 0;
    else { const s = h.seats.find(s => s.id === id); if (s) c -= s.putIn; }
  }
  return c;
}
function completedHands() {
  const a = state.history.slice();
  if (state.hand && state.hand.result) a.push(state.hand);
  return a;
}

/* ---------- starting a hand ---------- */
function startHand() {
  const boot = state.settings.boot;
  const h = {
    no: state.history.length + 1,
    dealer: state.dealer,
    seats: state.players.map(p => ({id:p.id, status:'blind', putIn:0})),
    pot: 0, stake: boot, turn: null, log: [], pending: null, result: null, revealed: {}
  };
  h.seats.forEach((s, i) => pay(h, i, boot));
  addLog(h, {kind:'boot', text:'Everyone paid the boot of ' + fmt(boot) + '. The pot starts at ' + fmt(h.pot) + '.'});
  h.turn = nextActive(h, h.dealer);
  state.hand = h;
  state.phase = 'playing';
  if (potLimitHit(h)) startPotLimit(h);
}

/* ---------- which moves are allowed right now ---------- */
function turnOptions(h) {
  const i = h.turn, seat = h.seats[i], S = h.stake, act = activeIdx(h), two = act.length === 2;
  const nm = E(i), opts = [], blocked = [];
  const limitMsg = 'the stake is already at the limit of ' + fmt(state.settings.stakeLimit) + '.';
  if (seat.status === 'blind') {
    opts.push({key:'blind', style:'gold', title:'Play Blind', amt:S,
      desc:'Pay ' + fmt(S) + ' without looking at your cards. The stake stays ' + fmt(S) + '.'});
    if (canRaise(h)) opts.push({key:'blindRaise', style:'ivory', title:'Blind Raise', amt:2 * S,
      desc:'Pay ' + fmt(2 * S) + ' without looking. The stake doubles to ' + fmt(2 * S) + ' for everyone after you.'});
    else blocked.push('Blind Raise: ' + limitMsg);
    opts.push({key:'look', style:'outline', title:'Look at My Cards', amt:null,
      desc:'Free. You pick up your cards and become Seen. From now on you pay double: ' + fmt(2 * S) + ' to stay in.'});
    if (two) {
      opts.push({key:'show', style:'sapphire', title:'Ask for a Show', amt:S,
        desc:'Pay ' + fmt(S) + '. Both players turn their cards face up and the better hand wins the pot. If the hands are exactly equal, the other player wins.'});
    } else {
      blocked.push('Show: only allowed when exactly 2 players are left in the hand.');
    }
    blocked.push('Side show: only a Seen player can ask for one.');
  } else {
    opts.push({key:'chaal', style:'gold', title:'Chaal', amt:2 * S,
      desc:'Stay in. Pay ' + fmt(2 * S) + ', which is twice the stake because you have seen your cards. The stake stays ' + fmt(S) + '.'});
    if (canRaise(h)) opts.push({key:'raise', style:'ivory', title:'Raise', amt:4 * S,
      desc:'Pay ' + fmt(4 * S) + '. The stake doubles to ' + fmt(2 * S) + ', so everyone after you must pay more.'});
    else blocked.push('Raise: ' + limitMsg);
    if (!two) {
      const p = prevActive(h, i);
      if (p >= 0 && h.seats[p].status === 'seen') {
        opts.push({key:'sideshow', style:'sapphire', title:'Side Show with ' + seatName(p), amt:2 * S,
          desc:'Pay ' + fmt(2 * S) + ', then ask ' + E(p) + ' to compare cards in secret. The lower hand must pack. If they are exactly equal, you pack. ' + E(p) + ' may refuse.'});
      } else {
        blocked.push('Side show: ' + (p >= 0 ? E(p) : 'the player before you') + ' is still Blind. Both players must have seen their cards.');
      }
      blocked.push('Show: only allowed when exactly 2 players are left in the hand.');
    } else {
      const o = act.find(j => j !== i);
      if (h.seats[o].status === 'seen') {
        opts.push({key:'show', style:'sapphire', title:'Ask for a Show', amt:2 * S,
          desc:'Pay ' + fmt(2 * S) + '. Both players turn their cards face up and the better hand wins the pot. If exactly equal, ' + E(o) + ' wins because you asked.'});
      } else {
        blocked.push('Show: ' + E(o) + ' is still Blind, and a Seen player is not allowed to ask a Blind player for a show. Keep betting or pack.');
      }
      blocked.push('Side show: not possible with only 2 players left. Use Show instead.');
    }
  }
  opts.push({key:'pack', style:'ruby', title:'Pack (Fold)', amt:null, wide:true,
    desc:'Give up this hand. You lose the ' + fmt(seat.putIn) + ' you have already put in, but nothing more.'});
  return {opts:opts, blocked:blocked};
}

/* ---------- doing a move ---------- */
function doAction(key) {
  const h = state.hand;
  if (!h || h.result || h.pending) return;
  const legal = turnOptions(h).opts.some(o => o.key === key);
  if (!legal) return;
  const i = h.turn, seat = h.seats[i], S = h.stake, nm = seatName(i), id = seat.id;
  snapshot();
  switch (key) {
    case 'blind':
      pay(h, i, S);
      addLog(h, {kind:'blind', pid:id, amt:S, blind:true, text:nm + ' played blind: ' + fmt(S) + '.'});
      afterBet(h, i); break;
    case 'blindRaise':
      pay(h, i, 2 * S); h.stake = 2 * S;
      addLog(h, {kind:'blindRaise', pid:id, amt:2 * S, blind:true, text:nm + ' raised blind: ' + fmt(2 * S) + '. The stake is now ' + fmt(h.stake) + '.'});
      afterBet(h, i); break;
    case 'look':
      seat.status = 'seen';
      addLog(h, {kind:'look', pid:id, text:nm + ' looked at their cards and is now Seen.'});
      break;
    case 'chaal':
      pay(h, i, 2 * S);
      addLog(h, {kind:'chaal', pid:id, amt:2 * S, blind:false, text:nm + ' played chaal: ' + fmt(2 * S) + '.'});
      afterBet(h, i); break;
    case 'raise':
      pay(h, i, 4 * S); h.stake = 2 * S;
      addLog(h, {kind:'raise', pid:id, amt:4 * S, blind:false, text:nm + ' raised: ' + fmt(4 * S) + '. The stake is now ' + fmt(h.stake) + '.'});
      afterBet(h, i); break;
    case 'pack': {
      seat.status = 'packed';
      addLog(h, {kind:'pack', pid:id, text:nm + ' packed and lost ' + fmt(seat.putIn) + '.'});
      const a = activeIdx(h);
      if (a.length === 1) endHand(h, [a[0]], 'packed'); else h.turn = nextActive(h, i);
      break;
    }
    case 'sideshow': {
      const p = prevActive(h, i);
      pay(h, i, 2 * S);
      addLog(h, {kind:'sideshowAsk', pid:id, amt:2 * S, blind:false, text:nm + ' paid ' + fmt(2 * S) + ' and asked ' + seatName(p) + ' for a side show.'});
      if (potLimitHit(h)) startPotLimit(h); else h.pending = {type:'sideshow', from:i, to:p, stage:'ask'};
      break;
    }
    case 'show': {
      const o = activeIdx(h).find(j => j !== i);
      const wasBlind = seat.status === 'blind';
      const cost = wasBlind ? S : 2 * S;
      pay(h, i, cost);
      addLog(h, {kind:'showAsk', pid:id, amt:cost, blind:wasBlind, text:nm + ' paid ' + fmt(cost) + ' and asked for a show.'});
      h.pending = {type:'show', payer:i, other:o};
      break;
    }
  }
  save(); render();
}
function afterBet(h, i) { if (potLimitHit(h)) startPotLimit(h); else h.turn = nextActive(h, i); }
function startPotLimit(h) {
  h.pending = {type:'potlimit'};
  ui.plSel = [];
  addLog(h, {kind:'potlimit', text:'The pot reached the limit of ' + fmt(state.settings.potLimit) + '. Everyone still in must show their cards.'});
}
function mergeRevealed(h, rev) { if (rev) h.revealed = Object.assign(h.revealed || {}, rev); }

/* ---------- side show, show, pot limit outcomes ---------- */
function ssRespond(accept) {
  const h = state.hand, pd = h.pending;
  if (!pd || pd.type !== 'sideshow' || pd.stage !== 'ask') return;
  snapshot();
  if (accept) {
    pd.stage = 'compare';
    addLog(h, {kind:'sideshowAccept', pid:h.seats[pd.to].id, text:seatName(pd.to) + ' accepted. The two compare cards privately.'});
  } else {
    addLog(h, {kind:'sideshowRefuse', pid:h.seats[pd.to].id, text:seatName(pd.to) + ' refused the side show. Play carries on.'});
    h.pending = null;
    h.turn = nextActive(h, pd.from);
  }
  save(); render();
}
function ssResult(winner, revealed) {
  const h = state.hand, pd = h.pending;
  if (!pd || pd.type !== 'sideshow' || pd.stage !== 'compare') return;
  if (winner !== 'tie' && winner !== pd.from && winner !== pd.to) return;
  snapshot();
  const tie = winner === 'tie';
  const w = tie ? pd.to : winner;
  const l = w === pd.from ? pd.to : pd.from;
  h.seats[l].status = 'packed';
  mergeRevealed(h, revealed);
  addLog(h, {kind:'sideshowResult', winner:h.seats[w].id, loser:h.seats[l].id,
    text: tie ? 'The hands were exactly equal. ' + seatName(l) + ' asked for the side show, so ' + seatName(l) + ' packs.'
              : seatName(w) + ' had the better hand. ' + seatName(l) + ' packs.'});
  h.pending = null;
  const a = activeIdx(h);
  if (a.length === 1) endHand(h, [a[0]], 'sideshow'); else h.turn = nextActive(h, pd.from);
  save(); render();
}
function showResult(winner, revealed) {
  const h = state.hand, pd = h.pending;
  if (!pd || pd.type !== 'show') return;
  if (winner !== 'tie' && winner !== pd.payer && winner !== pd.other) return;
  snapshot();
  const tie = winner === 'tie';
  const w = tie ? pd.other : winner;
  const l = w === pd.payer ? pd.other : pd.payer;
  mergeRevealed(h, revealed);
  addLog(h, {kind:'showResult', winner:h.seats[w].id, loser:h.seats[l].id,
    text: tie ? 'The hands were exactly equal, so ' + seatName(w) + ' wins, because ' + seatName(l) + ' paid for the show.'
              : seatName(w) + ' wins the show.'});
  endHand(h, [w], 'show');
  save(); render();
}
function plResult(winners, revealed) {
  const h = state.hand;
  if (!h.pending || h.pending.type !== 'potlimit' || !winners.length) return;
  if (winners.some(w => !h.seats[w] || h.seats[w].status === 'packed')) return;
  snapshot();
  mergeRevealed(h, revealed);
  endHand(h, winners.slice().sort((a, b) => a - b), 'potlimit');
  ui.plSel = [];
  save(); render();
}
function endHand(h, winners, how) {
  const pot = h.pot, k = winners.length, share = Math.floor(pot / k), rem = pot - share * k;
  const nets = {};
  h.seats.forEach(s => { nets[s.id] = -s.putIn; });
  winners.forEach((w, ix) => { nets[h.seats[w].id] += share + (ix === 0 ? rem : 0); });
  const winIds = winners.map(w => h.seats[w].id);
  let handType = null;
  if (winIds.length === 1 && h.revealed && h.revealed[winIds[0]] != null) handType = h.revealed[winIds[0]];
  h.result = {winners:winIds, how:how, pot:pot, nets:nets, handType:handType};
  h.turn = null; h.pending = null;
  state.phase = 'handEnd';
  addLog(h, {kind:'win', text: k === 1 ? pname(winIds[0]) + ' wins the pot of ' + fmt(pot) + '.'
                                       : 'The pot of ' + fmt(pot) + ' is split between ' + winIds.map(pname).join(' and ') + '.'});
}
function nextHand() {
  const h = state.hand;
  if (!h || !h.result) return;
  snapshot();
  state.history.push(h);
  state.dealer = (h.dealer + 1) % state.players.length;
  state.hand = null;
  startHand();
  save(); render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function cancelHand() {
  const h = state.hand;
  if (!h || h.result) return;
  snapshot();
  state.dealer = h.dealer;
  state.hand = null;
  startHand();
  save(); render();
  toast('Hand cancelled. Everyone got their chips back and the same dealer deals again.');
}

/* ---------- statistics ---------- */
function computeStats() {
  const st = {};
  state.players.forEach(p => { st[p.id] = {id:p.id, name:p.name, net:0, played:0, won:0, biggest:0, best:-1,
    turns:0, blindTurns:0, packs:0, raises:0, ssWon:0, ssLost:0, showWon:0, showLost:0}; });
  for (const h of completedHands()) {
    const r = h.result;
    h.seats.forEach(s => { const x = st[s.id]; if (x) { x.played++; x.net += r.nets[s.id] || 0; } });
    r.winners.forEach(id => {
      const x = st[id]; if (!x) return;
      x.won++;
      const seat = h.seats.find(s => s.id === id);
      x.biggest = Math.max(x.biggest, (r.nets[id] || 0) + seat.putIn);
    });
    if (r.handType != null && r.winners.length === 1 && st[r.winners[0]]) st[r.winners[0]].best = Math.max(st[r.winners[0]].best, r.handType);
    if (h.revealed) for (const id in h.revealed) if (st[id]) st[id].best = Math.max(st[id].best, h.revealed[id]);
    for (const e of h.log) {
      const x = e.pid != null ? st[e.pid] : null;
      if (x && ['blind', 'blindRaise', 'chaal', 'raise', 'sideshowAsk', 'showAsk'].indexOf(e.kind) >= 0) { x.turns++; if (e.blind) x.blindTurns++; }
      if (x && e.kind === 'pack') x.packs++;
      if (x && (e.kind === 'blindRaise' || e.kind === 'raise')) x.raises++;
      if (e.kind === 'sideshowResult') { if (st[e.winner]) st[e.winner].ssWon++; if (st[e.loser]) st[e.loser].ssLost++; }
      if (e.kind === 'showResult') { if (st[e.winner]) st[e.winner].showWon++; if (st[e.loser]) st[e.loser].showLost++; }
    }
  }
  return st;
}
function settleUp(st) {
  const cred = [], debt = [];
  Object.values(st).forEach(x => { if (x.net > 0) cred.push({n:x.name, a:x.net}); else if (x.net < 0) debt.push({n:x.name, a:-x.net}); });
  cred.sort((a, b) => b.a - a.a); debt.sort((a, b) => b.a - a.a);
  const out = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const m = Math.min(debt[i].a, cred[j].a);
    out.push({from:debt[i].n, to:cred[j].n, amt:m});
    debt[i].a -= m; cred[j].a -= m;
    if (!debt[i].a) i++;
    if (!cred[j].a) j++;
  }
  return out;
}

function startGame() {
  const d = ui.draft;
  const seen = {};
  const names = Array.from({length:d.count}, (_, i) => (d.names[i] || '').trim() || ('Player ' + (i + 1))).map(n => {
    const k = n.toLowerCase();
    if (seen[k]) { seen[k]++; return n + ' ' + seen[k]; }
    seen[k] = 1; return n;
  });
  const boot = d.boot, start = d.startChips;
  let err = '';
  if (!(Number.isInteger(boot) && boot >= 1)) err = 'The boot must be a whole number, 1 or more.';
  else if (!(Number.isInteger(start) && start >= 0)) err = 'Starting chips must be a whole number, 0 or more.';
  else if (d.limitsOn && !(Number.isInteger(d.stakeLimit) && d.stakeLimit >= boot)) err = 'The stake limit must be at least the boot (' + fmt(boot) + ').';
  else if (d.limitsOn && !(Number.isInteger(d.potLimit) && d.potLimit > boot * d.count)) err = 'The pot limit must be more than ' + fmt(boot * d.count) + ' (everyone’s boot added up).';
  if (err) { ui.setupError = err; render(); return; }
  ui.setupError = '';
  state = {v:1, phase:'playing',
    settings:{boot:boot, startChips:start, limitsOn:d.limitsOn, stakeLimit:d.stakeLimit, potLimit:d.potLimit, a23Top:d.a23Top},
    players:names.map((n, i) => ({id:'p' + (i + 1), name:n})), dealer:Math.min(d.firstDealer, d.count - 1), hand:null, history:[]};
  undoStack = [];
  startHand();
  ui.draft = null;
  save(); render();
  window.scrollTo({top:0});
}

  }
  const st = computeStats();
  const hands = completedHands();
  const rows = Object.values(st).sort((a, b) => b.net - a.net || b.won - a.won);
  const lb = rows.map((x, k) => {

    : '<p class="empty">Everyone is level. Nobody owes anybody.</p>';
  const pcs = rows.map(x => {
    const blindPct = x.turns ? Math.round(100 * x.blindTurns / x.turns) + '% of bets' : '—';
    return '<div class="pc"><h3>' + esc(x.name) + '</h3>' +
      '<div class="standing ' + (x.net > 0 ? 'up' : x.net < 0 ? 'down' : '') + '">' + (x.net > 0 ? 'Up ' : x.net < 0 ? 'Down ' : 'Level ') + fmt(Math.abs(x.net)) + '</div>' +

function downloadCSV() {
  const ps = state.players, st = computeStats();
  const cell = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['Hand', 'Dealer', 'Winner(s)', 'Pot', 'How it ended', 'Winning hand'].concat(ps.map(p => p.name + ' (+/-)'))];
  completedHands().forEach(h => {
    const r = h.result;
    rows.push([h.no, pname(h.seats[h.dealer].id), r.winners.map(pname).join(' & '), r.pot, HOW_SHORT[r.how], r.handType != null ? CATS[r.handType] : '']
      .concat(ps.map(p => r.nets[p.id] || 0)));
  });
  rows.push([]);
  rows.push(['Total', '', '', '', '', ''].concat(ps.map(p => st[p.id].net)));
  rows.push(['Chips now', '', '', '', '', ''].concat(ps.map(p => chipsOf(p.id))));
  const csv = rows.map(r => r.map(cell).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = 'teen-patti-' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

    '<div class="sk">The idea</div><h2 class="sh">In one line</h2>' +
    '<p>Everyone gets 3 cards and bets on them. You win the pot (the chips in the middle) in one of two ways: <b>everyone else gives up</b>, or <b>you have the best hand when the cards are shown</b>. You can win with poor cards if you bet bravely.</p>' +

    '<div class="sk">The start</div><h2 class="sh">How a hand starts</h2><ol class="steps">' +
      '<li><b>Boot.</b> Everyone pays the same entry fee, the boot (' + fmt(b) + ' in your game), into the pot. The app does this automatically.</li>' +

      '<li><b>First turn.</b> The player to the dealer’s left goes first. Turns go round the table in seating order, again and again, until the hand ends.</li>' +
      '<li><b>Next hand.</b> The dealer moves one seat to the left.</li>' +
    '</ol>' +
    '<div class="note"><p><b>There is no small blind or big blind in Teen Patti.</b> Those come from poker. Here everyone pays the same boot, and “Blind” means betting without having looked at your cards.</p></div>' +

    '<div class="sk">The key idea</div><h2 class="sh">Blind or Seen</h2>' +
    '<p>The <b>stake</b> is the current price of staying in. It starts at the boot. A <b>Blind</b> player (has not looked) pays the stake. A <b>Seen</b> player (has looked) pays <b>double</b>. Once you look, you stay Seen for the rest of the hand.</p>' +
    '<table><thead><tr><th></th><th>To stay in</th><th>To raise</th></tr></thead><tbody>' +

    move('Blind Raise', '2 × stake', 'You have not looked. Pay double the stake. The stake doubles for everyone after you.') +
    move('Look at My Cards', 'Free', 'Pick up your cards. You are now Seen, and you choose a Seen move straight away.') +
    move('Chaal', '2 × stake', 'You have seen your cards. Pay twice the stake to stay in. This is “matching”.') +
    move('Raise', '4 × stake', 'You have seen your cards. Pay four times the stake. The stake doubles for everyone after you.') +
    move('Pack', 'Free', 'Fold. You give up this hand and lose what you have put in so far, but nothing more.') +
    move('Side Show', '2 × stake', 'Seen players only, with 3 or more still in. You pay a chaal, then ask the player just before you (who must also be Seen) to compare cards secretly. They may refuse. If they accept, the lower hand packs. If exactly equal, you pack.') +
    move('Show', 'Blind 1 × · Seen 2 × stake', 'Only when exactly 2 players are left. Both turn their cards over and the better hand wins the pot. A Seen player cannot ask a Blind player for a show. If exactly equal, the player who asked loses.') +

    '<div class="sk">The finish</div><h2 class="sh">How a hand ends</h2><ol class="steps">' +
      '<li><b>Everyone else packs.</b> The last player left takes the pot and never has to show their cards.</li>' +

/* ---------- card checker (modal) ---------- */
function openChecker(ctx) {
  const h = state.hand;
  const mk = (label, seat) => ({label:label, seat:seat, cards:[null, null, null]});
  let hands;
  if (ctx === 'show') hands = [h.pending.payer, h.pending.other].map(i => mk(seatName(i), i));
  else if (ctx === 'sideshow') hands = [h.pending.from, h.pending.to].map(i => mk(seatName(i), i));
  else if (ctx === 'potlimit') hands = activeIdx(h).map(i => mk(seatName(i), i));
  else hands = [mk('Hand A', null), mk('Hand B', null)];
  ui.checker = {ctx:ctx, hands:hands, pick:null};
  render();
}
function usedCards(c) {
  const set = {};
  c.hands.forEach((x, hi) => x.cards.forEach((cd, si) => {
    if (cd && !(c.pick && c.pick.hand === hi && c.pick.slot === si)) set[cd.r + cd.s] = true;
  }));
  return set;
}
function checkerVerdict(c) {
  if (!c.hands.every(x => x.cards.every(Boolean))) return null;
  const evs = c.hands.map(x => evaluate(x.cards, state.settings.a23Top));
  let best = 0;
  evs.forEach((e, i) => { if (compareEval(e, evs[best]) > 0) best = i; });
  const winners = evs.map((e, i) => i).filter(i => compareEval(evs[i], evs[best]) === 0);
  return {evs:evs, winners:winners};
}
function renderChecker() {
  const c = ui.checker;
  if (c.pick) return renderPicker(c);
  const v = checkerVerdict(c);
  const handsHtml = c.hands.map((x, hi) => {
    const win = v && v.winners.indexOf(hi) >= 0;
    const label = v ? CATS[v.evs[hi][0]] + (win ? (v.winners.length > 1 ? ' · tied best' : ' · winner') : '') : '';
    const cards = x.cards.map((cd, si) => cd
      ? '<button class="slot-filled" data-action="ckSlot" data-h="' + hi + '" data-s="' + si + '" aria-label="Change card">' + cardHTML(cd, 'lg') + '</button>'
      : '<button class="slot" data-action="ckSlot" data-h="' + hi + '" data-s="' + si + '"><b>+</b>Card ' + (si + 1) + '</button>').join('');
    return '<div class="ck-hand ' + (win ? 'win' : '') + '"><div class="ck-name"><b>' + esc(x.label) + '</b><span>' + label + '</span></div><div class="ck-cards">' + cards + '</div></div>';
  }).join('');
  let verdict = '', confirm = '';
  if (v) {
    const wn = v.winners.map(i => esc(c.hands[i].label));
    if (v.winners.length === 1) verdict = '<b>' + wn[0] + '</b> wins with a <b>' + CATS[v.evs[v.winners[0]][0]] + '</b>.';
    else verdict = 'Exactly equal best hands: <b>' + wn.join(' and ') + '</b>.';
    const h = state.hand;
    if (c.ctx === 'show') {
      const pd = h.pending;

      confirm = v.winners.length === 1 ? 'Confirm: ' + wn[0] + ' wins the pot' : 'Confirm: split the pot between ' + wn.join(' and ');
    }

  return '<div class="modal-back" data-action="ckBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Card checker">' +
    '<div class="modal-head"><div><div class="kicker">Card checker</div><h2>' + (free ? 'Which hand wins?' : 'Tap in the cards') + '</h2></div>' +
    '<button class="btn" data-action="ckClose">Close</button></div>' +
    '<p style="margin:0;color:var(--grey)">Tap each empty card, then choose its rank and suit. Tap a card again to change it.</p>' +
    handsHtml +
    (free && c.hands.length < 6 ? '<div style="margin-top:14px"><button class="btn" data-action="ckAdd" style="width:100%">Add another hand</button></div>' : '') +
    (v ? '<div class="verdict">' + verdict + '</div>' : '') +
    '<div class="modal-actions ' + (confirm ? 'two' : '') + '">' +
      (confirm ? '<button class="btn btn-main" data-action="ckConfirm">' + confirm + '</button>' : '') +
      '<button class="btn" data-action="ckClear">Clear all cards</button>' +
    '</div></div></div>';
}

function ckConfirm() {
  const c = ui.checker, v = checkerVerdict(c);

  const h = state.hand, revealed = {};

/* ---------- motion: the name rises in, the pot counts up ---------- */
const REDUCE_MOTION = typeof window !== 'undefined' && !!window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastTurnKey = null, lastPot = null, lastPotHand = null;
function animateTurn() {
  if (typeof document === 'undefined' || !document.querySelector) return;
  const nameEl = document.querySelector('.turn-name[data-turn]');
  if (nameEl) {
    const key = nameEl.getAttribute('data-turn');
    if (!REDUCE_MOTION && lastTurnKey !== null && key !== lastTurnKey) {
      nameEl.classList.add('enter');
      requestAnimationFrame(() => requestAnimationFrame(() => nameEl.classList.add('settle')));
    }
    lastTurnKey = key;
  }
  const potEl = document.getElementById('potNum'), h = state.hand;
  if (potEl && h) {
    if (!REDUCE_MOTION && lastPotHand === h.no && lastPot !== null && h.pot > lastPot) {
      const from = lastPot, to = h.pot, t0 = performance.now();
      (function step(t) {
        const p = Math.min(1, (t - t0) / 420), e = 1 - Math.pow(1 - p, 3);
        potEl.textContent = fmt(Math.round(from + (to - from) * e));
        if (p < 1) requestAnimationFrame(step);
      })(t0);
      setTimeout(() => { potEl.textContent = fmt(to); }, 480);  // always land on the exact total
    }
    lastPot = h.pot; lastPotHand = h.no;
  }
}

function render() {
  renderTabs();

  if (ui.tab === 'scores') html = renderScores();
  else if (ui.tab === 'rules') html = renderRules();
  else if (ui.tab === 'rankings') html = renderRankings();
  else html = (state.phase === 'setup' || !state.hand) ? renderSetup() : renderTable();
  document.getElementById('app').innerHTML = html;
  const modal = ui.checker ? renderChecker() : ui.confirm ? renderConfirm() : '';
  document.getElementById('modal-root').innerHTML = modal;
  document.body.classList.toggle('noscroll', !!modal);
  animateTurn();
}

/* =====================================================================
   4. TAPS AND TYPING
   ===================================================================== */
function handle(a, el) {
  const d = el.dataset;
  switch (a) {
    case 'tab': ui.tab = d.tab; render(); window.scrollTo({top:0}); return;
    // setup
    case 'setCount': {
      const n = +d.n, dr = ui.draft; dr.count = n;
      while (dr.names.length < n) dr.names.push('');
      if (dr.firstDealer >= n) dr.firstDealer = 0;
      render(); return;
    }
    case 'setLimits': ui.draft.limitsOn = d.on === '1'; render(); return;
    case 'setA23': ui.draft.a23Top = d.top === '1'; render(); return;
    case 'setDealer': ui.draft.firstDealer = +d.i; document.getElementById('dealer-choose').innerHTML = dealerButtons(); return;
    case 'startGame': startGame(); return;
    // table
    case 'act': doAction(d.key); return;
    case 'ssAccept': ssRespond(true); return;
    case 'ssRefuse': ssRespond(false); return;
    case 'ssWin': ssResult(d.seat === 'tie' ? 'tie' : +d.seat); return;
    case 'showWin': showResult(d.seat === 'tie' ? 'tie' : +d.seat); return;
    case 'plToggle': {
      const i = +d.seat, k = ui.plSel.indexOf(i);
      if (k >= 0) ui.plSel.splice(k, 1); else ui.plSel.push(i);
      render(); return;
    }
    case 'plConfirm': if (ui.plSel.length) plResult(ui.plSel); return;
    case 'setType': {
      const h = state.hand; if (!h || !h.result) return;
      h.result.handType = d.t === 'none' ? null : +d.t;
      save(); render(); return;
    }
    case 'nextHand': nextHand(); return;
    case 'undo':
      if (!undoStack.length) return;
      state = JSON.parse(undoStack.pop());
      ui.checker = null; ui.plSel = [];
      save(); render(); toast('Undone.');
      return;
    case 'cancelHand':
      askConfirm('Cancel this hand?', 'Use this for a misdeal. Every chip paid in this hand goes back to its owner, and the same dealer deals again.', 'Yes, cancel the hand', cancelHand);
      return;
    // scores
    case 'toggleHand': ui.openHand = ui.openHand === +d.no ? null : +d.no; render(); return;
    case 'download': downloadCSV(); return;
    case 'newNight':
      askConfirm('Start a new game night?', 'This clears every score and every hand from this session. Download the record first if you want to keep it. Your player names will be kept for setup.', 'Yes, start fresh', () => {
        const old = state;
        state = freshState();
        state.settings = old.settings;
        state.players = old.players;
        initDraft();
        state.players = [];
        undoStack = [];
        ui.tab = 'table'; ui.openHand = null;
        save(); render(); window.scrollTo({top:0});
      });
      return;
    case 'confirmOk': { const fn = ui.confirm && ui.confirm.fn; ui.confirm = null; render(); if (fn) fn(); return; }
    case 'confirmCancel': ui.confirm = null; render(); return;
    // checker
    case 'openChecker': openChecker(d.ctx); return;
    case 'ckClose': ui.checker = null; render(); return;
    case 'ckBackdrop': if (el === lastClickTarget) { ui.checker = null; render(); } return;
    case 'ckAdd': ui.checker.hands.push({label:'Hand ' + 'ABCDEF'[ui.checker.hands.length], seat:null, cards:[null, null, null]}); render(); return;
    case 'ckClear': ui.checker.hands.forEach(x => { x.cards = [null, null, null]; }); render(); return;
    case 'ckSlot': ui.checker.pick = {hand:+d.h, slot:+d.s, rank:null}; render(); return;
    case 'ckBack': { const p = ui.checker.pick; if (p.rank != null) p.rank = null; else ui.checker.pick = null; render(); return; }
    case 'ckRank': ui.checker.pick.rank = +d.r; render(); return;
    case 'ckSuit': {
      const c = ui.checker, p = c.pick, x = c.hands[p.hand];
      x.cards[p.slot] = {r:p.rank, s:d.s};
      const nextEmpty = x.cards.findIndex(cd => !cd);
      c.pick = nextEmpty >= 0 ? {hand:p.hand, slot:nextEmpty, rank:null} : null;
      render(); return;
    }
    case 'ckConfirm': ckConfirm(); return;
  }
}
let lastClickTarget = null;

if (typeof document !== 'undefined') {
  const saved = load();
  if (saved) { state = saved.state; undoStack = saved.undo || []; }

  document.addEventListener('click', e => {
    lastClickTarget = e.target;
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    handle(el.dataset.action, el);
  });
  document.addEventListener('input', e => {
    const t = e.target, dr = ui.draft;
    if (!dr) return;
    if (t.dataset.name != null) { dr.names[+t.dataset.name] = t.value; return; }
    if (t.dataset.field) {
      const f = t.dataset.field, v = parseInt(t.value, 10);
      dr[f] = isNaN(v) ? '' : v;
      if (f === 'stakeLimit' || f === 'potLimit') dr.limitsTouched = true;
      if (f === 'boot' && !dr.limitsTouched && v > 0) {
        dr.stakeLimit = v * 128; dr.potLimit = v * 1024;
        const sl = document.querySelector('[data-field="stakeLimit"]'), pl = document.querySelector('[data-field="potLimit"]');
        if (sl) sl.value = dr.stakeLimit;
        if (pl) pl.value = dr.potLimit;
      }
    }
  });
  document.addEventListener('change', e => {
    if (e.target.dataset && e.target.dataset.name != null && ui.draft) {
      const box = document.getElementById('dealer-choose');
      if (box) box.innerHTML = dealerButtons();
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && (ui.checker || ui.confirm)) { ui.checker = null; ui.confirm = null; render(); }
  });
  render();
}
</script>

</html>
